<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>HSC Economics Link Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-height tool. Top bar (title, search, mode), map canvas left, detail panel right (stacks below on phones). */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#14202b; --muted:#566573; --line:#cfd8e0;
  --cluster:#e9eef2; --titlebar:#22313f; --titletext:#ffffff; --pillbase:#ffffff;
  --accent:#8b3fa8; --ink2:#22313f; --hubfill:#22313f; --hubtext:#ffffff;
  --t1:#1f6fb4; --t2:#2a9a3a; --t3:#d68a00; --t4:#d1302f;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#16202a; --fg:#e8eef3; --muted:#9db0c0; --line:#2b3a47;
  --cluster:#141d26; --titlebar:#2c3e50; --titletext:#ffffff; --pillbase:#16202a;
  --accent:#c58be0; --ink2:#d3dee8; --hubfill:#2c3e50; --hubtext:#ffffff;
  --t1:#4f9bdc; --t2:#4fbf5f; --t3:#f0a830; --t4:#ee6a68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16202a; --fg:#e8eef3; --muted:#9db0c0; --line:#2b3a47;
  --cluster:#141d26; --titlebar:#2c3e50; --titletext:#ffffff; --pillbase:#16202a;
  --accent:#c58be0; --ink2:#d3dee8; --hubfill:#2c3e50; --hubtext:#ffffff;
  --t1:#4f9bdc; --t2:#4fbf5f; --t3:#f0a830; --t4:#ee6a68; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;display:flex;flex-direction:column;gap:10px;overflow-x:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font:800 22px/1.1 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 small{display:block;font:500 12px/1.3 var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;min-width:0}
.search{position:relative}
input[type=search]{font:inherit;width:230px;max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.sug{position:absolute;z-index:20;top:100%;left:0;right:0;margin-top:3px;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:280px;overflow:auto;min-width:260px}
.sug button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--fg);font:inherit;padding:6px 10px;cursor:pointer}
.sug button:hover,.sug button:focus-visible{background:var(--cluster)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--surface);color:var(--fg);padding:7px 11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--titlebar);color:#fff}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 11px;border-radius:6px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px}
.stage{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);touch-action:none}
svg{display:block;width:100%;height:100%;cursor:grab;user-select:none}
svg.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:34px;height:34px;padding:0;font-size:18px}
aside{min-width:0;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
aside h2{font:800 17px/1.2 var(--display);margin:0;text-wrap:balance}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.lab{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
ul.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
ul.links button{width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:5px;padding:6px 8px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
ul.links button:hover{background:var(--cluster)}
.sg{font-weight:700;min-width:1.2em;text-align:center;color:var(--c)}
.hint{color:var(--muted);font-size:13px}
.key{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.key div{display:flex;gap:8px;align-items:center}
.sw{width:22px;height:0;border-top:3px solid var(--fg);flex:none}
/* svg parts */
.cl{fill:var(--cluster);stroke:var(--line);stroke-width:.03}
.tb{fill:var(--titlebar)}
.hubbg{fill:var(--cluster);stroke:var(--line);stroke-width:.04}
.pill rect{fill:color-mix(in srgb,var(--c) 17%,var(--pillbase));stroke:var(--c);stroke-width:.045;transition:opacity .15s}
.pill text{fill:var(--fg);text-anchor:middle}
.pill{cursor:pointer;transition:opacity .15s}
.pill.hub rect{fill:var(--hubfill);stroke:var(--surface)}
.pill.hub text{fill:var(--hubtext);font-weight:700}
.pill.sel rect{stroke:var(--fg);stroke-width:.14}
.pill:hover rect{stroke-width:.1}
.pill:focus{outline:none}
.pill:focus-visible rect{stroke:var(--accent);stroke-width:.14}
.edge{transition:opacity .15s}
.halo{fill:none;stroke:var(--surface);stroke-linejoin:round;stroke-linecap:round}
.ln{fill:none;stroke-linejoin:round}
.bd circle{fill:var(--surface);stroke-width:.04}
.bd text{text-anchor:middle;font-weight:700}
.dim .pill:not(.on){opacity:.22}
.dim .edge:not(.on){opacity:.05}
.dim .cl,.dim .hubbg{opacity:.6}
.conf{stroke:var(--accent);fill:none;stroke-dasharray:.25 .15}
.hdr{fill:var(--muted);font-weight:700;letter-spacing:.04em}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  aside{max-height:38vh}
  .tools{margin-left:0}
  h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){.pill,.edge,.pill rect{transition:none}}
</style>

<header>
  <h1>HSC Economics Link Map<small>Tap or click any dot point to see only the links that touch it.</small></h1>
  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="Find a dot point" aria-label="Find a dot point" autocomplete="off"><div class="sug" id="sug" hidden></div></div>
    <div class="seg" role="group" aria-label="Which links to show">
      <button id="m1" aria-pressed="true">Direct links</button>
      <button id="m2" aria-pressed="false">Whole chain</button>
    </div>
    <button class="btn" id="fit">Show everything</button>
  </div>
</header>
<main>
  <div class="stage" id="stage">
    <svg id="svg" role="img" aria-label="Mind map of all HSC Economics dot points and the cause and effect links between them"></svg>
    <div class="zoom"><button class="btn" id="zi" aria-label="Zoom in">+</button><button class="btn" id="zo" aria-label="Zoom out">–</button></div>
  </div>
  <aside id="panel"></aside>
</main>

  sel = id;
  if (id == null) {
    svg.classList.remove("dim");
    Object.values(pillEls).forEach(g => g.classList.remove("on", "sel"));
    edges.forEach(o => o.g.classList.remove("on"));
    renderPanel(); return;
  }
  const {eset, nset} = trace(id);
  svg.classList.add("dim");
  Object.entries(pillEls).forEach(([k, g]) => { g.classList.toggle("on", nset.has(k)); g.classList.toggle("sel", k === id); });
  edges.forEach((o, i) => o.g.classList.toggle("on", eset.has(i)));
  // bring highlighted edges to front
  eset.forEach(i => gEdges.appendChild(edges[i].g));
  renderPanel();
  if (zoom) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const add = (x, y) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); };
    nset.forEach(k => { const p = pillById[k]; add(p.x0, Y(p.y0)); add(p.x1, Y(p.y1)); });
    eset.forEach(i => D.edges[i].poly.forEach(q => add(q[0], Y(q[1]))));
    goTo(fitBox({x: x0, y: y0, w: x1 - x0, h: y1 - y0}, 1.5));
  }
}

function item(id, sg, cls) {
  const li = document.createElement("li"), b = document.createElement("button");
  b.style.setProperty("--c", TCOL[pillById[id].tp]);
  b.innerHTML = `<span class="sg">${sg}</span><span></span>`; b.lastChild.textContent = label(id);
  b.onclick = () => select(id, true); li.appendChild(b); return li;
}
function renderPanel() {
  const P = document.getElementById("panel"); P.innerHTML = "";
  if (sel == null) {
    P.innerHTML = `<h2>How to read this map</h2>
    <p class="hint">Every syllabus dot point is a box, grouped around the six economic objectives. Click one to dim everything except the arrows into and out of it. Use Whole chain to follow effects all the way through.</p>
    <div class="key">
      <div><span class="sw"></span>cause → effect (colour is the topic of the cause)</div>
      <div><span class="sw" style="border-top-width:5px"></span>policy response → objective</div>
      <div><span class="sw" style="border-top:3px dashed var(--accent)"></span>potential conflict between objectives</div>
      <div><b>+</b> same direction &nbsp; <b>–</b> opposite direction &nbsp; <b>±</b> depends on the change</div>
    </div>
    <div class="key">${[1,2,3,4].map(t => `<div><span class="dot" style="background:${TCOL[t]}"></span>${TNAME[t]}</div>`).join("")}</div>
    <p class="hint">Drag to pan, scroll or use + / – to zoom.</p>`;
    return;
  }
  const p = pillById[sel], h = document.createElement("div");
  h.innerHTML = `<span class="tag"><span class="dot" style="background:${TCOL[p.tp]}"></span>${TNAME[p.tp]}</span>`;
  const t = document.createElement("h2"); t.textContent = label(sel); h.appendChild(t); P.appendChild(h);
  const sec = (title, idxs, key) => {
    const d = document.createElement("div"); d.innerHTML = `<p class="lab">${title}</p>`;
    if (!idxs.length) { d.insertAdjacentHTML("beforeend", `<p class="hint">None on this map.</p>`); }
    else { const ul = document.createElement("ul"); ul.className = "links"; idxs.forEach(i => ul.appendChild(item(D.edges[i][key], D.edges[i].sg, ""))); d.appendChild(ul); }
    P.appendChild(d);
  };
  sec("Caused by", inn[sel] || [], "a");
  sec("Leads to", out[sel] || [], "b");
  if (mode === 2) { const {nset} = trace(sel); const n = document.createElement("p"); n.className = "hint"; n.textContent = `Whole chain: ${nset.size - 1} connected dot points are lit.`; P.appendChild(n); }
  const r = document.createElement("button"); r.className = "btn"; r.textContent = "Clear selection"; r.onclick = () => { select(null); fitAll(); }; P.appendChild(r);
}

// background click, pan, zoom
const stage = document.getElementById("stage");
let drag = null, moved = false;
svg.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, vb: {...vb}}; moved = false; });
addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; svg.classList.add("drag"); cancelAnimationFrame(anim); }
  if (!moved) return;
  const r = svg.getBoundingClientRect(), sc = drag.vb.w / r.width;
  vb = {...drag.vb, x: drag.vb.x - dx * sc, y: drag.vb.y - dy * sc}; applyVB();
});
addEventListener("pointerup", () => { drag = null; svg.classList.remove("drag"); });
svg.addEventListener("click", () => { if (!moved && sel != null) { select(null); } });
function zoomAt(f, cx, cy) {
  const r = svg.getBoundingClientRect(), fx = cx == null ? .5 : (cx - r.left) / r.width, fy = cy == null ? .5 : (cy - r.top) / r.height;
  const nw = Math.min(PW * 1.2, Math.max(4, vb.w * f)), nh = vb.h * nw / vb.w;
  vb = {x: vb.x + (vb.w - nw) * fx, y: vb.y + (vb.h - nh) * fy, w: nw, h: nh}; applyVB();
}
svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY > 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, {passive: false});
document.getElementById("zi").onclick = () => zoomAt(1 / 1.3);
document.getElementById("zo").onclick = () => zoomAt(1.3);
document.getElementById("fit").onclick = () => { select(null); fitAll(); };
["m1", "m2"].forEach((id, i) => document.getElementById(id).onclick = () => {
  mode = i + 1; document.getElementById("m1").setAttribute("aria-pressed", mode === 1); document.getElementById("m2").setAttribute("aria-pressed", mode === 2);
  if (sel != null) select(sel, true);
});

// search
const q = document.getElementById("q"), sug = document.getElementById("sug");
const all = D.pills.map(p => ({id: p.id, t: flat(p.text), tp: p.tp}));
q.addEventListener("input", () => {
  const v = q.value.trim().toLowerCase(); sug.innerHTML = "";
  if (!v) { sug.hidden = true; return; }
  const m = all.filter(a => a.t.toLowerCase().includes(v)).slice(0, 8);
  m.forEach(a => { const b = document.createElement("button"); b.innerHTML = `<span class="dot" style="background:${TCOL[a.tp]}"></span><span></span>`; b.lastChild.textContent = a.t;
    b.onclick = () => { select(a.id, true); q.value = ""; sug.hidden = true; }; sug.appendChild(b); });
  if (!m.length) sug.innerHTML = `<button disabled>No dot point matches</button>`;
  sug.hidden = false;
});
q.addEventListener("keydown", e => { if (e.key === "Enter") { const b = sug.querySelector("button:not([disabled])"); if (b) b.click(); } if (e.key === "Escape") { sug.hidden = true; } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) sug.hidden = true; });

applyVB(); renderPanel();
addEventListener("resize", () => { if (sel == null) fitAll(); });
requestAnimationFrame(fitAll);
</script>
